<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SignUp - CabWave</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    
    <h1><i class="fas fa-taxi"></i> CabWave</h1>
    <nav>
      <a href="index.html">Home</a> | <a href="login.html">Login</a>
    </nav>
  </header>

  <main>
    <div class="login-container">
      <form class="login-form" action="#" method="post">
        <h2>Signup for CabWave</h2>

        <div class="form-fields">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>

          <label for="mobile">Mobile Number</label>
          <input type="tel" id="mobile" name="mobile" placeholder="Enter your mobile number" required>

          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>

          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" required>
        </div>

        <button type="submit">Sign Up</button>

        <p class="signup-prompt">Already have an account? <a href="login.html">Login</a></p>
      </form>
    </div>
  </main>

  
</body>
</html>
